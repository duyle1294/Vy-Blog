<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Get in touch with Vy."><title>Contact — Vy’s World</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header" data-site-header></header><main><section class="inner-hero"><div class="page-shell"><p class="eyebrow">A friendly hello</p><h1 class="display">Let’s talk.</h1><p>Have a story to share, a project in mind, or simply want to say hello? I would love to hear from you.</p></div></section><section class="page-shell contact-layout"><div class="contact-copy"><p class="eyebrow">Find me here</p><h2 class="display">Leave a little note.</h2><p>This is a quiet corner of the internet, but kind conversations are always welcome.</p><div class="contact-links"><a href="mailto:hello@vysworld.com">hello@vysworld.com ↗</a><a href="#instagram">Instagram ↗</a><a href="#linkedin">LinkedIn ↗</a></div></div><form class="contact-form" data-contact-form><div class="form-field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div><div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div><button class="button" type="submit">Send message <span aria-hidden="true">&nbsp;→</span></button><p class="form-notice" data-form-notice hidden aria-live="polite"></p></form></section></main><footer class="site-footer" data-site-footer></footer><script src="js/main.js"></script></body></html>
